# Project configuration

# ---------------------------------------------------------------------------
# Provider chain – keep the list in order of preference.
# Each provider has:
# * name: human readable identifier
# * mode: "online" or "local" – the startup menu only loads one mode at a time
# * base_url: the absolute endpoint for the OpenAI‑compatible chat API
# * env_var: name of the environment variable that stores the API key
# * models: ordered list of preferred model identifiers
# ---------------------------------------------------------------------------
providers:
  - name: kaggle_ollama
    mode: local
    kind: ollama
    base_url_env: OLLAMA_BASE_URL
    api_key_env: OLLAMA_AUTH_TOKEN
    models: ["qwen3-coder:30b"]
    # Only one model local, so both tiers land on it.
    tiers:
      fast: ["qwen3-coder:30b"]
      strong: ["qwen3-coder:30b"]
    connect_timeout_s: 4
    read_timeout_s: 60
    options: { num_ctx: 16384 }
  - name: groq
    mode: online
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # Live Groq model list, strongest first. The chain now falls through both
    # models and providers, so every entry here is a real fallback.
    models:
      - "openai/gpt-oss-120b"
      - "qwen/qwen3.8-27b"
      - "openai/gpt-oss-20b"
    # Two thinking tiers. The router picks one per message; /fast and /strong
    # override it for the session.
    tiers:
      fast: ["openai/gpt-oss-20b", "qwen/qwen3.8-27b"]
      strong: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
    connect_timeout_s: 8
    read_timeout_s: 30
cooldown_s: 20

